<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch Plan Intro</title>
<style>
  :root { --pitch-blue: #329bd0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: #329bd0; }
  #pitch-intro {
    position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center;
    overflow: hidden; isolation: isolate;
    background: radial-gradient(ellipse at 50% 44%, #54b9eb 0%, #329bd0 46%, #1679b0 100%);
    animation: intro-out 3.4s cubic-bezier(.65,0,.35,1) forwards;
  }
  .ambient {
    position: absolute; inset: -20%; z-index: -2; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.18), transparent 42%);
    animation: ambient-pulse 2.4s ease-in-out both;
  }
  .halo {
    position: absolute; width: min(58vw, 360px); aspect-ratio: 1; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.38); opacity: 0; transform: scale(.6);
    box-shadow: 0 0 55px rgba(255,255,255,.12), inset 0 0 50px rgba(255,255,255,.05);
    animation: halo-expand 1.3s .15s ease-out both;
  }
  .halo.two { width: min(76vw, 480px); animation-delay: .35s; }
  .logo-stage {
    position: relative; width: clamp(125px, 25vw, 185px); aspect-ratio: 1;
    display: grid; place-items: center; border-radius: 28%;
    background: linear-gradient(145deg, rgba(255,255,255,.24), rgba(255,255,255,.08));
    border: 1px solid rgba(255,255,255,.68);
    box-shadow: 0 26px 70px rgba(4,48,80,.34), 0 8px 24px rgba(4,48,80,.22),
                inset 0 1px 0 rgba(255,255,255,.55);
    opacity: 0; transform: translateY(28px) scale(.68) rotate(-4deg);
    animation: logo-in 1s .08s cubic-bezier(.16,1,.3,1) forwards, logo-exit .45s 2.48s ease-in forwards;
  }
  .logo {
    display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 28%;
    filter: drop-shadow(0 7px 13px rgba(0,35,65,.12));
  }
  .shine {
    position: absolute; inset: 0; border-radius: 28%; overflow: hidden; pointer-events: none;
  }
  .shine::after {
    content: ""; position: absolute; top: -25%; bottom: -25%; left: -75%; width: 42%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.58), transparent);
    transform: skewX(-22deg); animation: shine-sweep .85s .82s ease-in-out both;
  }
  @keyframes logo-in {
    0% { opacity: 0; transform: translateY(28px) scale(.68) rotate(-4deg); }
    65% { opacity: 1; transform: translateY(-4px) scale(1.045) rotate(1deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
  }
  @keyframes logo-exit {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-14px) scale(.94); }
  }
  @keyframes halo-expand {
    0% { opacity: 0; transform: scale(.6); }
    30% { opacity: .75; }
    100% { opacity: 0; transform: scale(1.14); }
  }
  @keyframes ambient-pulse {
    0% { opacity: 0; transform: scale(.9); }
    35% { opacity: 1; transform: scale(1); }
    100% { opacity: .6; transform: scale(1.05); }
  }
  @keyframes shine-sweep { from { left: -75%; } to { left: 145%; } }
  @keyframes intro-out {
    0%, 88% { opacity: 1; visibility: visible; }
    100% { opacity: 0; visibility: hidden; pointer-events: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #pitch-intro { animation-duration: .01ms; }
    .logo-stage, .halo, .ambient, .shine::after { animation-duration: .01ms; animation-delay: 0ms; }
  }
</style>
</head>

  <script>
    const intro = document.getElementById('pitch-intro');
    let finished = false;
    const finishIntro = () => {
      if (finished) return;
      finished = true;
      if (intro) intro.remove();
      document.documentElement.style.overflow = 'auto';
      document.body.style.overflow = 'auto';
      if (window.parent !== window) {
        const targetOrigin = window.location.origin === 'null' ? '*' : window.location.origin;
        window.parent.postMessage({ type: 'pitchplan-intro-finished' }, targetOrigin);
      }
    };
    intro?.addEventListener('animationend', event => {
      if (event.animationName === 'intro-out') finishIntro();
    });
    window.setTimeout(finishIntro, 3400);
  </script>
